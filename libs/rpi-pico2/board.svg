<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 210" width="510" height="210">
  <!-- Green Raspberry Pi Pico 2 PCB -->
  <rect x="8" y="2" width="500" height="206" rx="8" fill="#0f6a36" stroke="#094a24" stroke-width="1.5"/>

  <!-- 4 Corner M2 Mounting Holes -->
  <g>
    <circle cx="20" cy="40" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="20" cy="40" r="5.5" fill="#ffffff"/>
    <circle cx="20" cy="170" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="20" cy="170" r="5.5" fill="#ffffff"/>
    <circle cx="496" cy="40" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="496" cy="40" r="5.5" fill="#ffffff"/>
    <circle cx="496" cy="170" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="496" cy="170" r="5.5" fill="#ffffff"/>
  </g>

  <!-- Micro-USB Receptacle (left edge) -->
  <rect x="0" y="75" width="38" height="60" rx="3" fill="#cfd5dc" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="0" y="80" width="28" height="50" rx="2" fill="#e5e9ef"/>
  <rect x="20" y="86" width="12" height="6" rx="1" fill="#9ca3af"/>
  <rect x="20" y="118" width="12" height="6" rx="1" fill="#9ca3af"/>
  <!-- USB SMD pins -->
  <g fill="#d4af37">
    <rect x="38" y="92" width="5" height="2.4" rx="0.4"/>
    <rect x="38" y="97" width="5" height="2.4" rx="0.4"/>
    <rect x="38" y="102" width="5" height="2.4" rx="0.4"/>
    <rect x="38" y="107" width="5" height="2.4" rx="0.4"/>
    <rect x="38" y="112" width="5" height="2.4" rx="0.4"/>
  </g>

  <!-- Onboard Green LED (GP25) -->
  <rect x="50" y="45" width="12" height="7" rx="1" fill="#d0d7de" stroke="#8b949e" stroke-width="0.6"/>
  <rect x="52.5" y="46.2" width="7" height="4.6" rx="0.5" fill="#33ff33"/>
  <text x="56" y="41" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#ffffff" text-anchor="middle">LED</text>

  <!-- BOOTSEL Tactile Switch -->
  <rect x="84" y="47" width="34" height="26" rx="2.5" fill="#d0d7de" stroke="#8b949e" stroke-width="1"/>
  <rect x="89" y="51" width="24" height="18" rx="2" fill="#e6eaef"/>
  <circle cx="101" cy="60" r="6.5" fill="#ffffff" stroke="#b0b8c2" stroke-width="0.8"/>
  <text x="101" y="83" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#ffffff" text-anchor="middle">BOOTSEL</text>

  <!-- SMPS Inductor & Power Components -->
  <rect x="52" y="128" width="22" height="22" rx="2.5" fill="#2c3038" stroke="#4b5563" stroke-width="1"/>
  <circle cx="63" cy="139" r="6" fill="#3b4252"/>
  <rect x="86" y="132" width="14" height="14" rx="1.5" fill="#1b1e23" stroke="#374151" stroke-width="0.8"/>
  <rect x="108" y="128" width="8" height="14" rx="1" fill="#c49a6c"/>
  <rect x="122" y="128" width="8" height="14" rx="1" fill="#c49a6c"/>

  <!-- QSPI Flash IC -->
  <rect x="148" y="86" width="26" height="34" rx="2" fill="#181b20" stroke="#374151" stroke-width="0.9"/>
  <circle cx="153" cy="91" r="1.5" fill="#9ca3af"/>
  <text x="161" y="106" font-family="sans-serif" font-size="5.5" fill="#9ca3af" text-anchor="middle">FLASH</text>

  <!-- 12 MHz Crystal -->
  <rect x="190" y="132" width="16" height="12" rx="1.5" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

  <!-- RP2350 Dual Cortex-M33 QFN-60 SoC (center) -->
  <g>
    <rect x="220" y="77" width="56" height="56" rx="2.5" fill="#181b20" stroke="#374151" stroke-width="1.2"/>
    <circle cx="227" cy="84" r="1.8" fill="#9ca3af"/>
    <text x="248" y="101" font-family="sans-serif" font-weight="bold" font-size="10" fill="#e5e7eb" text-anchor="middle">RP2350</text>
    <text x="248" y="114" font-family="sans-serif" font-size="7" fill="#9ca3af" text-anchor="middle">ARM M33</text>
  </g>

  <!-- Silkscreen Branding -->
  <text x="248" y="55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">Raspberry Pi Pico 2</text>
  <text x="380" y="110" font-family="sans-serif" font-size="8.5" fill="#d1fae5" text-anchor="middle">RP2350  •  4MB Flash</text>

  <!-- 3-pin SWD Debug Header (right edge) -->
  <g fill="#d4af37" stroke="#9e7f1a" stroke-width="0.7">
    <circle cx="486" cy="90" r="5"/><circle cx="486" cy="90" r="2.6" fill="#ffffff" stroke="none"/>
    <circle cx="486" cy="105" r="5"/><circle cx="486" cy="105" r="2.6" fill="#ffffff" stroke="none"/>
    <circle cx="486" cy="120" r="5"/><circle cx="486" cy="120" r="2.6" fill="#ffffff" stroke="none"/>
  </g>
  <text x="476" y="92" font-family="sans-serif" font-size="5.5" fill="#ffffff" text-anchor="end">SWCLK</text>
  <text x="476" y="107" font-family="sans-serif" font-size="5.5" fill="#ffffff" text-anchor="end">GND</text>
  <text x="476" y="122" font-family="sans-serif" font-size="5.5" fill="#ffffff" text-anchor="end">SWDIO</text>

  <!-- Top Row Castellated + Through-Hole Pads (Pins 40..21, y=14) -->
  <g fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8">
    <circle cx="28" cy="14" r="7"/><circle cx="28" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="52" cy="14" r="7"/><circle cx="52" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="76" cy="14" r="7"/><circle cx="76" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="100" cy="14" r="7"/><circle cx="100" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="124" cy="14" r="7"/><circle cx="124" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="148" cy="14" r="7"/><circle cx="148" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="172" cy="14" r="7"/><circle cx="172" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="196" cy="14" r="7"/><circle cx="196" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="220" cy="14" r="7"/><circle cx="220" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="244" cy="14" r="7"/><circle cx="244" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="268" cy="14" r="7"/><circle cx="268" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="292" cy="14" r="7"/><circle cx="292" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="316" cy="14" r="7"/><circle cx="316" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="340" cy="14" r="7"/><circle cx="340" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="364" cy="14" r="7"/><circle cx="364" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="388" cy="14" r="7"/><circle cx="388" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="412" cy="14" r="7"/><circle cx="412" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="436" cy="14" r="7"/><circle cx="436" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="460" cy="14" r="7"/><circle cx="460" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="484" cy="14" r="7"/><circle cx="484" cy="14" r="3.8" fill="#ffffff" stroke="none"/>
  </g>
  <!-- Top Row Pin Labels -->
  <g font-family="sans-serif" font-size="5.2" fill="#ffffff" text-anchor="middle">
    <text x="28" y="29">VBUS</text>
    <text x="52" y="29">VSYS</text>
    <text x="76" y="29">GND</text>
    <text x="100" y="29">3V_EN</text>
    <text x="124" y="29">3V3</text>
    <text x="148" y="29">VREF</text>
    <text x="172" y="29">GP28</text>
    <text x="196" y="29">GND</text>
    <text x="220" y="29">GP27</text>
    <text x="244" y="29">GP26</text>
    <text x="268" y="29">RUN</text>
    <text x="292" y="29">GP22</text>
    <text x="316" y="29">GND</text>
    <text x="340" y="29">GP21</text>
    <text x="364" y="29">GP20</text>
    <text x="388" y="29">GP19</text>
    <text x="412" y="29">GP18</text>
    <text x="436" y="29">GND</text>
    <text x="460" y="29">GP17</text>
    <text x="484" y="29">GP16</text>
  </g>

  <!-- Bottom Row Castellated + Through-Hole Pads (Pins 1..20, y=196) -->
  <g fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8">
    <circle cx="28" cy="196" r="7"/><circle cx="28" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="52" cy="196" r="7"/><circle cx="52" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="76" cy="196" r="7"/><circle cx="76" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="100" cy="196" r="7"/><circle cx="100" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="124" cy="196" r="7"/><circle cx="124" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="148" cy="196" r="7"/><circle cx="148" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="172" cy="196" r="7"/><circle cx="172" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="196" cy="196" r="7"/><circle cx="196" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="220" cy="196" r="7"/><circle cx="220" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="244" cy="196" r="7"/><circle cx="244" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="268" cy="196" r="7"/><circle cx="268" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="292" cy="196" r="7"/><circle cx="292" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="316" cy="196" r="7"/><circle cx="316" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="340" cy="196" r="7"/><circle cx="340" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="364" cy="196" r="7"/><circle cx="364" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="388" cy="196" r="7"/><circle cx="388" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="412" cy="196" r="7"/><circle cx="412" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="436" cy="196" r="7"/><circle cx="436" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="460" cy="196" r="7"/><circle cx="460" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
    <circle cx="484" cy="196" r="7"/><circle cx="484" cy="196" r="3.8" fill="#ffffff" stroke="none"/>
  </g>
  <!-- Bottom Row Pin Labels -->
  <g font-family="sans-serif" font-size="5.2" fill="#ffffff" text-anchor="middle">
    <text x="28" y="185">GP0</text>
    <text x="52" y="185">GP1</text>
    <text x="76" y="185">GND</text>
    <text x="100" y="185">GP2</text>
    <text x="124" y="185">GP3</text>
    <text x="148" y="185">GP4</text>
    <text x="172" y="185">GP5</text>
    <text x="196" y="185">GND</text>
    <text x="220" y="185">GP6</text>
    <text x="244" y="185">GP7</text>
    <text x="268" y="185">GP8</text>
    <text x="292" y="185">GP9</text>
    <text x="316" y="185">GND</text>
    <text x="340" y="185">GP10</text>
    <text x="364" y="185">GP11</text>
    <text x="388" y="185">GP12</text>
    <text x="412" y="185">GP13</text>
    <text x="436" y="185">GND</text>
    <text x="460" y="185">GP14</text>
    <text x="484" y="185">GP15</text>
  </g>
