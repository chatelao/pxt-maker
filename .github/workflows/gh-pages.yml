name: Deploy MakeCode Maker to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

# Vendored CODAL (RP2350) declares cmake_minimum_required < 3.5, which CMake 4.x on
# ubuntu-latest rejects. Opt in to the documented compatibility override.
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pxt-maker
        uses: actions/checkout@v4
        with:
          path: pxt-maker

      - name: Checkout chatelao/pxt
        uses: actions/checkout@v4
        with:
          repository: chatelao/pxt
          ref: master
          path: pxt

      - name: Checkout chatelao/pxt-common-packages
        uses: actions/checkout@v4
        with:
          repository: chatelao/pxt-common-packages
          ref: master
          path: pxt-common-packages

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ARM GCC toolchain for RP2350 (Pico 2 / Pico 2 W)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake python-is-python3

      - name: Install & build pxt (CLI + Webapp)
        working-directory: pxt
        run: |
          npm install
          npm run build

      - name: Install & link pxt-maker dependencies
        working-directory: pxt-maker
        run: |
          npm install --legacy-peer-deps
          rm -rf node_modules/pxt-core node_modules/pxt-common-packages
          ln -s ../../pxt node_modules/pxt-core
          ln -s ../../pxt-common-packages node_modules/pxt-common-packages
          mkdir -p ../pxt-common-packages/node_modules
          ln -sfn ../../pxt ../pxt-common-packages/node_modules/pxt-core
          ln -sfn ../../pxt/node_modules/typescript ../pxt-common-packages/node_modules/typescript

      - name: Pull ESP-IDF v5.5.6 Docker image
        run: docker pull espressif/idf:v5.5.6

      - name: Pre-compile XIAO ESP32-C6 and Pico 2 / Pico 2 W firmware templates
        working-directory: pxt-maker
        env:
          PXT_FORCE_LOCAL: "1"
          PXT_SAVE_HEXCACHE: "1"
        run: |
          mkdir -p built/hexcache
          node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync("pxtarget.json","utf8")); t.versions={target:"0.15.80",pxt:"13.3.3"}; t.bundledpkgs={}; fs.writeFileSync("built/target.json", JSON.stringify(t, null, 2));'
          (cd libs/seeed-xiao-esp32c6 && node ../../../pxt/built/pxt.js build --localbuild --hwvariant esp32c6)
          (cd tests/e2e-xiao-esp32c6-neopixel && node ../../../pxt/built/pxt.js build --localbuild --hwvariant esp32c6)
          (cd libs/rpi-pico2 && PXT_NODOCKER=force node ../../../pxt/built/pxt.js build --localbuild --hwvariant rp2350)
          (cd libs/rpi-pico2-w && PXT_NODOCKER=force node ../../../pxt/built/pxt.js build --localbuild --hwvariant rp2350)

      - name: Build static MakeCode GitHub Pages bundle
        working-directory: pxt-maker
        run: |
          node ../pxt/built/pxt.js staticpkg \
            --quick \
            --route /pxt-maker \
            --output built/packaged \
            --no-appcache
          touch built/packaged/pxt-maker/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pxt-maker/built/packaged/pxt-maker

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
