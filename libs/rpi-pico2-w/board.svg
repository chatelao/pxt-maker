  <rect x="52" y="128" width="22" height="22" rx="2.5" fill="#2c3038" stroke="#4b5563" stroke-width="1"/>
  <circle cx="63" cy="139" r="6" fill="#3b4252"/>
  <rect x="86" y="132" width="14" height="14" rx="1.5" fill="#1b1e23" stroke="#374151" stroke-width="0.8"/>

