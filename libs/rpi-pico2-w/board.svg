    <circle cx="496" cy="40" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="496" cy="40" r="5.5" fill="#ffffff"/>
    <circle cx="496" cy="170" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="496" cy="170" r="5.5" fill="#ffffff"/>
  </g>

  <!-- Micro-USB Receptacle (left edge) -->
  <rect x="0" y="75" width="38" height="60" rx="3" fill="#cfd5dc" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="0" y="80" width="28" height="50" rx="2" fill="#e5e9ef"/>
  <rect x="20" y="86" width="12" height="6" rx="1" fill="#9ca3af"/>
  <rect x="20" y="118" width="12" height="6" rx="1" fill="#9ca3af"/>
  <g fill="#d4af37">
    <rect x="38" y="92" width="5" height="2.4" rx="0.4"/>
