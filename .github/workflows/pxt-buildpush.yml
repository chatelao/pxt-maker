name: pxt-buildpush

on:
  push:
    branches:
      - '**' # Run workflow when any branch is updated
    tags:
      - '*'  # Run workflow when any new tag is pushed
  pull_request:
    branches:
      - '**' # Run workflow for pull requests targeting any branch

permissions:
  contents: write
  id-token: write  # Required for OIDC

jobs:
  filter-vtags:
    uses: ./.github/workflows/is-vtag.yml

  tag-bump-commit:
    uses: ./.github/workflows/tag-bump-commit.yml
    needs: filter-vtags
    if: fromJSON(needs.filter-vtags.outputs.is_vtag || 'false') == false

  buildpush:
    name: buildpush
    runs-on: ubuntu-latest
    needs: tag-bump-commit
    if: always() && fromJSON(needs.tag-bump-commit.outputs.did_tag || 'false') == false
    steps:
      - name: Checkout pxt-maker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pxt-maker
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout chatelao/pxt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chatelao/pxt
          ref: master
          path: pxt

      - name: Checkout chatelao/pxt-common-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chatelao/pxt-common-packages
          ref: master
          path: pxt-common-packages

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install system dependencies for headless browser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y xvfb

      - name: Install & build pxt
        working-directory: pxt
        run: |
          npm install
          npx puppeteer browsers install chrome
          npm run build

      - name: Install & link pxt-maker dependencies
        working-directory: pxt-maker
        run: |
          npm install --legacy-peer-deps
          rm -rf node_modules/pxt-core node_modules/pxt-common-packages
          ln -s ../../pxt node_modules/pxt-core
          ln -s ../../pxt-common-packages node_modules/pxt-common-packages
          mkdir -p ../pxt-common-packages/node_modules
          ln -sfn ../../pxt ../pxt-common-packages/node_modules/pxt-core
          ln -sfn ../../pxt/node_modules/typescript ../pxt-common-packages/node_modules/typescript

      - name: pxt ci (without publish capability)
        working-directory: pxt-maker
        run: |
          node ../pxt/built/pxt.js ci
        env:
          DISPLAY: :99.0
          CI: true

  buildvtag:
    # This job is a duplicate of pxt-buildvtag.yml's workflow
    name: buildvtag
    runs-on: ubuntu-latest
    needs: tag-bump-commit
    if: always() && fromJSON(needs.tag-bump-commit.outputs.did_tag || 'false') == true
    steps:
      - name: Checkout pxt-maker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pxt-maker
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout chatelao/pxt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chatelao/pxt
          ref: master
          path: pxt

      - name: Checkout chatelao/pxt-common-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chatelao/pxt-common-packages
          ref: master
          path: pxt-common-packages

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install system dependencies for headless browser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y xvfb

      - name: Install & build pxt
        working-directory: pxt
        run: |
          npm install
          npx puppeteer browsers install chrome
          npm run build

      - name: Install & link pxt-maker dependencies
        working-directory: pxt-maker
        run: |
          npm install --legacy-peer-deps
          rm -rf node_modules/pxt-core node_modules/pxt-common-packages
          ln -s ../../pxt node_modules/pxt-core
          ln -s ../../pxt-common-packages node_modules/pxt-common-packages
          mkdir -p ../pxt-common-packages/node_modules
          ln -sfn ../../pxt ../pxt-common-packages/node_modules/pxt-core
          ln -sfn ../../pxt/node_modules/typescript ../pxt-common-packages/node_modules/typescript

      - name: pxt ci (with publish capability)
        working-directory: pxt-maker
        run: |
          node ../pxt/built/pxt.js ci --publish
        env:
          CROWDIN_KEY: ${{ secrets.CROWDIN_KEY }}
          PXT_ACCESS_TOKEN: ${{ secrets.PXT_ACCESS_TOKEN }}
          NPM_PUBLISH: true
          DISPLAY: :99.0
          CI: true
          PXT_SKIP_GIT_COMMIT: true

      - name: Clone release repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILT_REPO_NAME }}
          path: pxt-maker/tmp/releases/release
          fetch-depth: 3
          fetch-tags: true
          ssh-key: ${{ secrets.BUILT_REPO_DEPLOY_KEY }}

      - name: Read release info
        id: release_info
        working-directory: pxt-maker
        run: |
          tag=$(cat tmp/releases/release.json | jq -r '.tag')
          url=$(cat tmp/releases/release.json | jq -r '.url')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Push artifacts to release repo
        working-directory: pxt-maker
        run: |
          cp -a tmp/releases/built/. tmp/releases/release
          cd tmp/releases/release
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Release ${{steps.release_info.outputs.tag}} from ${{steps.release_info.outputs.url}}"
          git tag ${{steps.release_info.outputs.tag}}
          git push
          git push --tags