<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 210" width="510" height="210">
  <!-- Green Raspberry Pi Pico 2 W PCB -->
  <rect x="8" y="2" width="500" height="206" rx="8" fill="#0f6a36" stroke="#094a24" stroke-width="1.5"/>

  <!-- 4 Corner M2 Mounting Holes -->
  <g>
    <circle cx="20" cy="40" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
    <circle cx="20" cy="40" r="5.5" fill="#ffffff"/>
    <circle cx="20" cy="170" r="9.5" fill="#d4af37" stroke="#9e7f1a" stroke-width="0.8"/>
