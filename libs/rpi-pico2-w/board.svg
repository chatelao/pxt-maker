  <rect x="404" y="68" width="66" height="74" rx="3" fill="#0c552b" stroke="#22c55e" stroke-width="0.6" stroke-dasharray="3,2"/>
  <path d="M412 126 V84 H424 V120 H436 V84 H448 V120 H460 V84" fill="none" stroke="#d4af37" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/>

