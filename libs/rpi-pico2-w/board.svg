  <rect x="136" y="86" width="24" height="34" rx="2" fill="#181b20" stroke="#374151" stroke-width="0.9"/>
  <circle cx="141" cy="91" r="1.5" fill="#9ca3af"/>
  <text x="148" y="106" font-family="sans-serif" font-size="5.2" fill="#9ca3af" text-anchor="middle">FLASH</text>

